# --- 1. SERVIZIO HEADLESS (Obbligatorio per lo StatefulSet) ---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
spec:
  clusterIP: None
  selector:
    app: traffic-agent
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---
# --- 2. LO STATEFULSET ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: traffic-agent
spec:
  serviceName: "agent-service" # Ora questo servizio esiste!
  replicas: 1
  selector:
    matchLabels:
      app: traffic-agent
  template:
    metadata:
      labels:
        app: traffic-agent
      annotations: # <-- AGGIUNGI QUESTE TRE RIGHE
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 10.96.0.10
          - 8.8.8.8
        searches:
          - default.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "2"
      hostAliases:
      - ip: "192.168.49.1"
        hostnames:
        - "host.minikube.internal"
      containers:
      - name: agent
        image: tua-immagine-agent:latest
        imagePullPolicy: Never # Consigliato per Minikube locale
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: prompt-storage
          mountPath: /data/agentPrompt
        env:
        - name: BACKEND_API_URL
          value: "http://host.minikube.internal:8000/api"
        - name: MCP_SERVER_URL
          value: "http://host.minikube.internal:8001/sse"
        - name: ORCHESTRATOR_URL
          value: "http://orchestrator-service.default.svc.cluster.local:8080" # <-- NUOVO: Punta al K8s Service!
        - name: AGENT_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - secretRef:
            name: llm-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
      volumes:
      - name: prompt-storage
        hostPath:
          path: /data/agentPrompt   # <-- DEVE COINCIDERE CON MINIKUBE_MOUNT_TARGET
          type: DirectoryOrCreate