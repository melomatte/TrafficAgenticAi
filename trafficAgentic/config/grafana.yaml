grafana:
  dnsPolicy: "None"
  dnsConfig:
    nameservers:
      - 10.96.0.10
      - 8.8.8.8
    searches:
      - monitoring.svc.cluster.local
      - svc.cluster.local
      - cluster.local
    options:
      - name: ndots
        value: "2"
  plugins:
    - yesoreyeram-infinity-datasource
  additionalDataSources:
    - name: loki
      type: loki
      access: proxy
      url: http://loki:3100
      jsonData:
        httpHeaderName1: 'X-Scope-OrgID'
      secureJsonData:
        httpHeaderValue1: 'local'
    - name: Infinity-API
      type: yesoreyeram-infinity-datasource
      access: proxy
      isDefault: false
      jsonData:
        allowedHosts:
          - http://host.minikube.internal:8000